# Caddy publishes HTTPS. The web app, models and database use the private Compose network.
# Run bash deploy.sh --production after configuring .env and local/db on the host.
name: rentkdubs

x-app-database: &app-database
  DATABASE_URL: postgres://rentkdubs_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/rentkdubs?sslmode=verify-full

secrets:
  db_owner_password:
    file: ./local/db/owner-password

services:
  db:
    image: timescale/timescaledb-ha:pg17-ts2.32@sha256:2491132fa6cf3621955727de400c33d1132d504628ca7617eee4d0ea571eaccf
    restart: unless-stopped
    environment:
      POSTGRES_DB: rentkdubs
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    secrets: [db_owner_password]
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/db-tls/server.crt, -c, ssl_key_file=/db-tls/server.key]
    volumes:
      - db-data:/home/postgres/pgdata/data
      - ./local/db/tls:/db-tls:ro
      - ./db/init-container.sh:/docker-entrypoint-initdb.d/020_app.sh:ro
    healthcheck:
      test: [CMD, pg_isready, -h, '127.0.0.1', -U, postgres, -d, rentkdubs]
      interval: 5s
      timeout: 3s
      retries: 24

  maintenance:
    profiles: [tools]
    build:
      context: .
      target: maintenance
    environment:
      NODE_EXTRA_CA_CERTS: /db-ca.crt
    secrets: [db_owner_password]
    volumes:
      - ./local/db/tls/server.crt:/db-ca.crt:ro
    entrypoint:
      - sh
      - -ec
      - |
        export DATABASE_URL="postgres://postgres:$$(cat /run/secrets/db_owner_password)@db:5432/rentkdubs?sslmode=verify-full"
        exec "$$@"
      - --
    command: [node, db/migrate.mjs]

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-database
      NODE_EXTRA_CA_CERTS: /db-ca.crt
      SEARCH_EXTRACTOR_URL: http://search-extractor:8081
      POI_SERVICE_URL: http://poi:8082
    volumes:
      - ./local/db/tls/server.crt:/db-ca.crt:ro
    depends_on:
      db:
        condition: service_healthy
      search-extractor:
        condition: service_healthy
      poi:
        condition: service_healthy
    expose:
      - "3000"

  worker:
    profiles: [scraper]
    build:
      context: .
      target: worker
    restart: on-failure
    shm_size: 1gb
    env_file: .env
    volumes:
      - worker-cache:/app/apps/worker/.cache

  search-extractor:
    build:
      context: apps/search
    restart: unless-stopped
    expose:
      - "8081"
    volumes:
      - search-models:/models
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/health', timeout=3).close()"]
      start_period: 5m
      interval: 10s
      timeout: 5s
      retries: 6

  poi:
    build:
      context: .
      dockerfile: apps/poi/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-database
      PGSSLROOTCERT: /db-ca.crt
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8082"
    volumes:
      - poi-models:/models
      - ./local/db/tls/server.crt:/db-ca.crt:ro
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8082/health', timeout=3).close()"]
      start_period: 5m
      interval: 10s
      timeout: 5s
      retries: 6

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env, e.g. 203-0-113-7.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
  search-models:
  poi-models:
  caddy_data:
  caddy_config:
  worker-cache:
